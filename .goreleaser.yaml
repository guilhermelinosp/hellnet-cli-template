version: 2

project_name: hellnet-cli-template

before:
  hooks:
    - go mod tidy

builds:
  - id: app
    main: ./cmd/app
    binary: "{{ .ProjectName }}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # trim exotic pairs; keep the support matrix documented in README
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X {{ .ModulePath }}/internal/build.Version={{ .Version }}
      - -X {{ .ModulePath }}/internal/build.Commit={{ .FullCommit }}
      - -X {{ .ModulePath }}/internal/build.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  mode: replace
