name: pr-check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: guilhermelinosp/templates/.github/workflows/shellcheck.yml@8f299961846cf1d0cbf7129a99ea6c3095ec3abd

  merge-check:
    uses: guilhermelinosp/templates/.github/workflows/merge-check.yml@8f299961846cf1d0cbf7129a99ea6c3095ec3abd

  gitleaks:
    uses: guilhermelinosp/templates/.github/workflows/gitleaks.yml@8f299961846cf1d0cbf7129a99ea6c3095ec3abd

  labeler:
    uses: guilhermelinosp/templates/.github/workflows/labeler.yml@8f299961846cf1d0cbf7129a99ea6c3095ec3abd
    with:
      app-client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
    secrets: inherit


  govulncheck:
    uses: guilhermelinosp/templates/.github/workflows/govulncheck.yml@8f299961846cf1d0cbf7129a99ea6c3095ec3abd

# CodeQL runs via the per-repo inline workflow (.github/workflows/codeql.yml):
# the reusable variant still triggers GitHub-side startup_failure across
# callers regardless of content/pinning; revisit after a clean-room repro.

  pr-gate:
    if: always()
    needs: [lint, merge-check, gitleaks, labeler, govulncheck]
    runs-on: ubuntu-latest
    steps:
      - name: gate
        shell: python
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          import json, os, sys
          needs = json.loads(os.environ['NEEDS'])
          failed = [k for k, v in needs.items() if v.get('result') not in ('success', 'skipped')]
          if failed:
              print('BLOCKED-BY:', failed)
              sys.exit(1)
          print('ALL-GREEN')
