name: pr-check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: guilhermelinosp/templates/.github/workflows/shellcheck.yml@e7d093b460c1e25f16121d509eefcbb597612c95 # main

  merge-check:
    uses: guilhermelinosp/templates/.github/workflows/merge-check.yml@e7d093b460c1e25f16121d509eefcbb597612c95 # main

  gitleaks:
    uses: guilhermelinosp/templates/.github/workflows/gitleaks.yml@e7d093b460c1e25f16121d509eefcbb597612c95 # main

  labeler:
    uses: guilhermelinosp/templates/.github/workflows/labeler.yml@e7d093b460c1e25f16121d509eefcbb597612c95 # main


  govulncheck:
    uses: guilhermelinosp/templates/.github/workflows/govulncheck.yml@e7d093b460c1e25f16121d509eefcbb597612c95 # main

# CodeQL runs via the per-repo inline workflow (.github/workflows/codeql.yml):
# the reusable variant still triggers GitHub-side startup_failure across
# callers regardless of content/pinning; revisit after a clean-room repro.
